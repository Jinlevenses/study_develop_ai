schema_v: 1
id: rb.solo-5
title_ko: "SOLO 5단 설명 루브릭"
applies_to: [blank_note, essay]
dims:
  d_coverage:
    name_ko: "핵심 포함"
    weight: 1
    levels:
      l1: "핵심 개념 하나만 단편적으로 언급한다."
      l2: "핵심 개념 여러 개를 나열하지만 서로 연결하지 못한다."
      l3: "핵심 개념들의 관계를 설명해 하나의 흐름으로 묶는다."
      l4: "관계를 새로운 상황으로 확장해 적용하거나 일반화한다."
  d_accuracy:
    name_ko: "정확성"
    weight: 1.5
    levels:
      l1: "설명에 사실과 다른 내용이 여러 군데 섞여 있다."
      l2: "대체로 맞지만 중요한 오류가 하나 남아 있다."
      l3: "설명이 정확하고 용어를 올바르게 쓴다."
      l4: "정확하며 예외와 경계 조건까지 짚는다."
  d_structure:
    name_ko: "구조"
    weight: 1
    levels:
      l1: "순서 없이 생각나는 대로 적는다."
      l2: "순서는 있으나 단계 사이 연결이 약하다."
      l3: "원인과 결과가 이어지는 구조로 서술한다."
      l4: "구조가 명확하고 다른 개념과의 관계까지 드러난다."
pass_mean: 2.5
