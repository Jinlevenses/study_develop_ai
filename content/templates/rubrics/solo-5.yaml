      l2: "아이디어를 여럿 나열하지만 서로의 관계는 연결하지 못하는 다중 구조 수준이다."
      l3: "아이디어 사이의 인과와 포함 관계를 연결해 전체를 설명하는 관계 구조 수준이다."
      l4: "관계 구조를 새로운 상황이나 상위 원리로 일반화하는 확장 추상 수준이다."
  d_accuracy:
