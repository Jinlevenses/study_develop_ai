# content/packs/net/kus/net.tcp-handshake.yaml
# yaml-language-server: $schema=../../../.schemas/kus.schema.json
schema_v: 1
concept_id: net.tcp-handshake
kus:
  k01:
    type: definition
    facet: definition
    statement: "TCP는 데이터를 보내기 전에 SYN, SYN+ACK, ACK 세 세그먼트를 주고받는 3방향 핸드셰이크로 연결을 수립한다."
    scope: ""
    vol: stable
    valid_as_of: "2026-10-02"
    level_min: 2
    bloom_affordance: [remember, understand]
    cloze_keys: ["3방향 핸드셰이크"]
    accept: { "3방향 핸드셰이크": ["3-way handshake", "three-way handshake", "3웨이 핸드셰이크", "삼방향 핸드셰이크"] }
    source_refs:
      - { source_id: src.rfc-9293, locator: "RFC 9293 §3.5", section: "Establishing a Connection", usage: paraphrase, retrieved_at: "2026-10-02" }
  k02:
    type: mechanism
    facet: mechanism
    statement: "핸드셰이크의 목적은 양쪽이 자기 초기 순서 번호(ISN)를 알리고 상대가 그 번호를 확인하게 하는 것이며, 서버는 확인과 자기 SYN을 한 세그먼트에 합쳐 보낸다."
    scope: ""
    vol: stable
    valid_as_of: "2026-10-02"
    level_min: 2
    bloom_affordance: [understand, analyze]
    cloze_keys: ["초기 순서 번호"]
    accept: { "초기 순서 번호": ["ISN", "initial sequence number", "시작 순서 번호", "초기 시퀀스 번호"] }
    source_refs:
      - { source_id: src.rfc-9293, locator: "RFC 9293 §3.4.1", section: "Initial Sequence Number Selection", usage: paraphrase, retrieved_at: "2026-10-02" }
      - { source_id: src.rfc-9293, locator: "RFC 9293 §3.5", section: "Establishing a Connection", usage: paraphrase, retrieved_at: "2026-10-02" }
  k03:
    type: property
    facet: mechanism
    statement: "SYN과 FIN은 각각 순서 번호 하나를 차지하므로, 이를 받은 쪽은 받은 순서 번호에 1을 더한 값을 확인 번호로 보낸다."
    scope: ""
    vol: stable
    valid_as_of: "2026-10-02"
    level_min: 2
    bloom_affordance: [understand, apply]
    cloze_keys: ["1을 더한"]
    accept: { "1을 더한": ["1 더한", "+1", "하나 더한"] }
    source_refs:
      - { source_id: src.rfc-9293, locator: "RFC 9293 §3.4", section: "Sequence Numbers", usage: paraphrase, retrieved_at: "2026-10-02" }
  k04:
    type: procedure_step
    facet: mechanism
    statement: "클라이언트는 SYN을 보내면 SYN-SENT, 서버는 LISTEN에서 SYN을 받고 응답하면 SYN-RECEIVED가 되며, 마지막 ACK가 오가면 양쪽 모두 ESTABLISHED가 된다."
    scope: ""
    vol: stable
    valid_as_of: "2026-10-02"
    level_min: 2
    bloom_affordance: [remember, understand]
    cloze_keys: ["SYN-SENT", "ESTABLISHED"]
    accept: { "SYN-SENT": ["SYN_SENT", "syn sent"], "ESTABLISHED": ["ESTAB", "established"] }
    source_refs:
      - { source_id: src.rfc-9293, locator: "RFC 9293 §3.3.2", section: "State Machine Overview", usage: paraphrase, retrieved_at: "2026-10-02" }
  k05:
    type: mechanism
    facet: mechanism
    statement: "TCP 연결은 방향마다 따로 닫히므로, FIN을 받은 쪽도 자기가 close하기 전까지는 반대 방향으로 데이터를 계속 보낼 수 있다."
    scope: ""
    vol: stable
    valid_as_of: "2026-10-02"
    level_min: 2
    bloom_affordance: [understand, analyze]
    cloze_keys: ["방향마다"]
    accept: { "방향마다": ["방향별로", "한 방향씩", "각 방향"] }
    source_refs:
      - { source_id: src.rfc-9293, locator: "RFC 9293 §3.6.1", section: "Half-Closed Connections", usage: paraphrase, retrieved_at: "2026-10-02" }
  k06:
    type: property
    facet: contrast
    statement: "TIME-WAIT 상태는 먼저 FIN을 보내 능동적으로 연결을 닫은 쪽에 생기며, 그쪽이 클라이언트인지 서버인지와는 관계가 없다."
    scope: ""
    vol: stable
    valid_as_of: "2026-10-02"
    level_min: 2
    bloom_affordance: [understand, analyze]
    cloze_keys: ["먼저 FIN을 보내"]
    accept: { "먼저 FIN을 보내": ["먼저 닫은", "능동 종료한", "먼저 FIN을 보낸"] }
    source_refs:
      - { source_id: src.rfc-9293, locator: "RFC 9293 §3.6", section: "Closing a Connection", usage: paraphrase, retrieved_at: "2026-10-02" }
  k07:
    type: mechanism
    facet: tradeoff
    statement: "TIME-WAIT에서 2MSL을 기다리는 이유는 유실된 마지막 ACK를 다시 보내고, 같은 주소·포트 쌍의 새 연결에 이전 연결의 늦은 세그먼트가 섞이지 않게 하기 위해서다."
    scope: ""
    vol: stable
    valid_as_of: "2026-10-02"
    level_min: 2
    bloom_affordance: [understand, evaluate]
    cloze_keys: ["2MSL"]
    accept: { "2MSL": ["2 MSL", "MSL의 두 배", "최대 세그먼트 수명의 두 배"] }
    source_refs:
      - { source_id: src.rfc-9293, locator: "RFC 9293 §3.6", section: "Closing a Connection", usage: paraphrase, retrieved_at: "2026-10-02" }
      - { source_id: src.rfc-9293, locator: "RFC 9293 §3.4.2", section: "Knowing When to Keep Quiet", usage: paraphrase, retrieved_at: "2026-10-02" }
  k08:
    type: failure_mode
    facet: operation
    statement: "소켓이 CLOSE-WAIT에 오래 쌓이면 상대의 FIN을 받은 뒤 이쪽 애플리케이션이 소켓을 close하지 않았다는 뜻이다."
    scope: ""
    vol: stable
    valid_as_of: "2026-10-02"
    level_min: 2
    bloom_affordance: [analyze, evaluate]
    cloze_keys: ["CLOSE-WAIT"]
    accept: { "CLOSE-WAIT": ["CLOSE_WAIT", "close wait"] }
    source_refs:
      - { source_id: src.rfc-9293, locator: "RFC 9293 §3.3.2", section: "State Machine Overview", usage: paraphrase, retrieved_at: "2026-10-02" }
  k09:
    type: config_fact
    facet: code
    statement: "Linux에서 핸드셰이크는 커널이 처리하고, accept()는 핸드셰이크를 마친 연결을 대기 큐에서 꺼내 줄 뿐이다."
    scope: "Linux ≥ 2.2"
    vol: stable
    valid_as_of: "2026-10-02"
    level_min: 2
    bloom_affordance: [understand, apply]
    cloze_keys: ["커널", "대기 큐"]
    accept: { "커널": ["kernel", "운영체제 커널", "OS"], "대기 큐": ["accept 큐", "accept queue", "백로그 큐", "backlog"] }
    source_refs:
      - { source_id: src.linux-man-pages, locator: "/man2/listen.2.html", section: "listen(2) — NOTES", usage: paraphrase, retrieved_at: "2026-10-02" }
  k10:
    type: failure_mode
    facet: operation
    statement: "듣고 있는 소켓이 없는 포트로 SYN이 도착하면 상대 호스트는 RST로 응답하고, connect()는 ECONNREFUSED 오류로 실패한다."
    scope: ""
    vol: stable
    valid_as_of: "2026-10-02"
    level_min: 2
    bloom_affordance: [understand, analyze]
    cloze_keys: ["RST"]
    accept: { "RST": ["reset", "리셋", "RST 세그먼트"] }
    source_refs:
      - { source_id: src.rfc-9293, locator: "RFC 9293 §3.5.2", section: "Reset Generation", usage: paraphrase, retrieved_at: "2026-10-02" }
      - { source_id: src.linux-man-pages, locator: "/man2/connect.2.html", section: "connect(2) — ERRORS", usage: paraphrase, retrieved_at: "2026-10-02" }
