# content/packs/k8s/items/k8s.probes.yaml
# yaml-language-server: $schema=../../../.schemas/items.schema.json
schema_v: 1
concept_id: k8s.probes
items:
  # ── 핵심 12 ──────────────────────────────────────────────
  i01:
    format: ox
    facet: mechanism
    response_mode: recognition
    level: 2
    bloom: understand
    ku_refs: [k02]
    stem_family: sf_probe_outcome
    roles: [pretest]
    gate_status: authored
    stem: "liveness 프로브가 연속으로 실패해 임계값에 닿으면 kubelet은 그 컨테이너를 종료하고 restartPolicy에 따라 다시 띄운다."
    answer: true
    correction_md: "맞다. liveness 실패의 결과는 컨테이너 종료이고, 다시 띄울지는 restartPolicy(기본 Always)가 정한다."
    explanation_md: "liveness는 '이 컨테이너를 살려 둘 가치가 있는가'를 묻는 프로브라 실패하면 재시작으로 이어진다(k02). 트래픽 제외는 readiness 쪽 결과이므로 둘을 섞지 않는다."
  i02:
    format: ox
    facet: contrast
    response_mode: recognition
    level: 2
    bloom: understand
    ku_refs: [k03]
    mc_refs: [m01]
    stem_family: sf_probe_outcome
    gate_status: authored
    stem: "readiness 프로브가 계속 실패하면 kubelet이 그 컨테이너를 재시작해 상태를 회복시킨다."
    answer: false
    false_mc: m01
    correction_md: "틀렸다. readiness 실패는 재시작을 일으키지 않는다. Pod가 Ready를 잃어 Service 엔드포인트에서 빠질 뿐이다."
    explanation_md: "readiness와 liveness를 섞은 전형적인 착각(m01)이다. readiness는 '지금 요청을 받아도 되는가'만 판정하므로 실패하면 트래픽만 끊고 컨테이너는 그대로 둔다(k03)."
  i03:
    format: ox
    facet: tradeoff
    response_mode: recognition
    level: 2
    bloom: evaluate
    ku_refs: [k08]
    mc_refs: [m02]
    stem_family: sf_probe_design
    gate_status: authored
    stem: "liveness 프로브가 데이터베이스 연결까지 확인해야, DB 장애가 났을 때 해당 Pod를 재시작해 문제를 고칠 수 있다."
    answer: false
    false_mc: m02
    correction_md: "틀렸다. DB 장애는 앱을 재시작해도 고쳐지지 않는다. liveness에 넣으면 DB가 잠시 끊길 때 모든 Pod가 함께 재시작된다."
    explanation_md: "liveness는 프로세스 자신의 상태만 봐야 한다(k08). 의존성 확인을 넣으면 공통 원인 하나에 모든 Pod가 동시에 반응해 장애가 커진다. 의존성 상태는 재시작이 아닌 다른 수단(오류 응답·서킷 브레이커)으로 다룬다."
  i04:
    format: ox
    facet: code
    response_mode: recognition
    level: 2
    bloom: understand
    ku_refs: [k06]
    mc_refs: [m05]
    stem_family: sf_probe_config
    gate_status: authored
    stem: "httpGet 프로브가 302 리다이렉트 응답을 받으면 상태 코드가 200이 아니므로 실패로 판정된다."
    answer: false
    false_mc: m05
    correction_md: "틀렸다. httpGet 프로브는 200 이상 400 미만을 모두 성공으로 본다. 302도 성공이다."
    explanation_md: "성공 범위는 200~399다(k06). 그래서 로그인 페이지로 리다이렉트하는 경로를 프로브로 쓰면 앱이 망가져도 성공으로 보일 수 있다. '200만 성공'이라는 생각이 m05다."
  i05:
    format: mcq
    facet: contrast
    response_mode: recognition
    level: 2
    bloom: understand
    ku_refs: [k03, k11]
    mc_refs: [m01, m04]
    stem_family: sf_probe_outcome
    roles: [pretest]
    gate_status: authored
    stem: "실행 중이던 Pod의 readiness 프로브가 실패하기 시작했다. 이때 일어나는 일로 가장 알맞은 것은?"
    options:
      opt_a: "컨테이너는 계속 실행되고, Pod가 Service 엔드포인트에서 빠져 새 요청을 받지 않는다"
      opt_b: "kubelet이 컨테이너를 종료하고 restartPolicy에 따라 같은 노드에서 다시 띄운다"
      opt_c: "시작할 때 이미 준비 확인을 통과했으므로 아무 변화 없이 요청을 계속 받는다"
      opt_d: "Pod가 삭제되고 컨트롤러가 다른 노드에 새 Pod를 만들어 트래픽을 넘긴다"
    answer: opt_a
    distractor_mc: { opt_b: m01, opt_c: m04, opt_d: m01 }
    option_rationale:
      opt_a: "readiness 실패는 재시작 없이 트래픽 대상에서만 제외한다."
      opt_b: "재시작은 liveness 실패의 결과다."
      opt_c: "readiness는 실행 내내 주기적으로 돌므로 실행 중 실패도 반영된다."
      opt_d: "프로브는 Pod를 지우거나 옮기지 않는다."
    explanation_md: "정답은 opt_a다. readiness는 실행 내내 돌며(k11) 실패하면 엔드포인트에서만 빠진다(k03). opt_b·opt_d는 readiness와 liveness의 결과를 섞은 착각(m01), opt_c는 readiness를 한 번만 통과하면 되는 관문으로 보는 착각(m04)이다."
  i06:
    format: mcq
    facet: tradeoff
    response_mode: recognition
    level: 2
    bloom: evaluate
    ku_refs: [k08, k02]
    mc_refs: [m02, m01, m04]
    stem_family: sf_probe_design
    gate_status: authored
    stem: "주문 서비스 Pod 20개의 liveness 프로브가 DB 연결까지 확인하는 `/healthz/deps`를 호출한다. DB가 30초 동안 응답하지 않을 때 가장 알맞은 판단은?"
    options:
      opt_a: "20개 Pod가 함께 재시작되어 DB가 돌아와도 서비스가 빈다. 의존성 확인은 liveness에서 뺀다"
      opt_b: "liveness가 DB 문제를 감지해 Pod를 재시작하므로 DB 연결이 새로 맺어져 장애가 빨리 회복된다"
      opt_c: "liveness 실패는 Pod를 트래픽에서 빼기만 하므로 컨테이너는 살아 있고 DB가 돌아오면 자연히 복구된다"
      opt_d: "liveness는 시작할 때 한 번만 검사하므로 실행 중에 생긴 DB 장애는 Pod에 아무 영향이 없다"
    answer: opt_a
    distractor_mc: { opt_b: m02, opt_c: m01, opt_d: m04 }
    option_rationale:
      opt_a: "공통 의존성 장애에 모든 Pod가 동시에 재시작되어 장애가 커진다."
      opt_b: "재시작은 DB를 고치지 못하고 시작 비용만 더한다."
      opt_c: "트래픽 제외는 readiness의 결과이고 liveness 실패는 재시작이다."
      opt_d: "liveness도 실행 내내 주기적으로 돈다."
    explanation_md: "정답은 opt_a다. liveness 실패는 재시작이고(k02) 의존성까지 확인하면 공통 원인 하나에 모든 Pod가 반응한다(k08). opt_b는 m02, opt_c는 liveness와 readiness 결과를 섞은 m01, opt_d는 프로브를 1회 관문으로 보는 m04에서 나온다."
  i07:
    format: mcq
    facet: operation
    response_mode: recognition
    level: 2
    bloom: apply
    ku_refs: [k04, k05]
    mc_refs: [m03, m01]
    stem_family: sf_probe_timing
    gate_status: authored
    stem: "시작에 최대 3분이 걸리는 앱이 배포 직후 준비를 마치기 전에 계속 재시작된다. liveness는 기본값(10초 주기, 실패 3회)이다. 가장 알맞은 수정은?"
    options:
      opt_a: "startupProbe(10초 주기, 실패 18회)를 추가해 시작하는 동안 liveness를 멈춘다"
      opt_b: "readiness 프로브만 추가한다. 준비가 끝날 때까지 kubelet이 재시작을 멈추고 기다려 준다"
      opt_c: "startupProbe를 둬도 liveness가 함께 도니 initialDelaySeconds만 180으로 늘린다"
      opt_d: "startupProbe(10초 주기, 실패 3회)를 추가한다. 이것으로 시작 시간이 충분히 보장된다"
    answer: opt_a
    distractor_mc: { opt_b: m01, opt_c: m03, opt_d: m03 }
    option_rationale:
      opt_a: "10초 × 18회 = 180초를 허용하고, 그동안 liveness가 돌지 않는다."
      opt_b: "readiness는 재시작을 제어하지 않는다. liveness가 그대로 컨테이너를 죽인다."
      opt_c: "startupProbe가 있으면 liveness는 그것이 성공할 때까지 실행되지 않는다."
      opt_d: "10초 × 3회 = 30초라 3분 시작을 감당하지 못한다."
    explanation_md: "정답은 opt_a다. startupProbe가 성공할 때까지 liveness가 멈추고(k04), 허용 시간은 failureThreshold × periodSeconds다(k05). opt_c는 startup과 liveness가 함께 돈다는 착각(m03), opt_d는 예산 계산을 놓친 경우, opt_b는 readiness가 재시작을 막는다는 착각(m01)이다."
  i08:
    format: cloze
    facet: mechanism
    response_mode: production
    level: 2
    bloom: remember
    ku_refs: [k03]
    stem_family: sf_cloze_probe
    gate_status: authored
    stem: "readiness 프로브가 실패하면 Pod는 {{b1}} 상태를 잃어 Service가 트래픽을 보내지 않지만, 컨테이너가 {{b2}}되지는 않는다."
    blanks:
      b1: { accept: ["Ready", "레디", "준비", "준비 완료"] }
      b2: { accept: ["재시작", "restart", "다시 시작", "재기동"] }
    explanation_md: "readiness는 Ready 조건만 바꾼다(k03). 재시작은 liveness·startup 실패의 결과라 빈칸 b2에는 readiness와 관계없는 동작이 들어간다."
  i09:
    format: short
    facet: code
    response_mode: production
    level: 2
    bloom: apply
    ku_refs: [k05]
    stem_family: sf_probe_budget
    gate_status: authored
    stem: "startupProbe가 `periodSeconds: 10`, `failureThreshold: 30`으로 설정되어 있다. 컨테이너가 시작을 마치기까지 허용되는 최대 시간은 대략 몇 초인가?"
    accept: ["300", "300초", "5분"]
    numeric: { value: 300, tol_abs: 10, unit: "초" }
    explanation_md: "허용 시간은 failureThreshold × periodSeconds = 30 × 10 = 300초다(k05). 30초라고 답했다면 주기를 곱하지 않은 것이고, 이 시간이 지나도 성공하지 못하면 컨테이너가 종료된다."
  i10:
    format: config_review
    facet: operation
    response_mode: recognition
    level: 2
    bloom: evaluate
    ku_refs: [k08, k04, k02]
    mc_refs: [m02, m03]
    stem_family: sf_probe_manifest
    gate_status: authored
    stem: "이 앱은 시작에 최대 90초가 걸리고, `/healthz/deps`는 데이터베이스와 캐시 연결까지 확인하는 엔드포인트다. 아래 매니페스트에서 고쳐야 할 줄을 모두 고르세요(결함 3곳)."
    artifact:
      lang: yaml
      src: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: orders-api
        spec:
          containers:
            - name: app
              image: registry.example.com/orders-api:1.4.2
              ports:
                - containerPort: 8080
              livenessProbe:
                httpGet:
                  path: /healthz/deps
                  port: 8080
                periodSeconds: 5
                failureThreshold: 1
              readinessProbe:
                httpGet:
                  path: /ready
                  port: 8080
                periodSeconds: 5
    defect_manifest:
      df_no_startup: { from: 11, to: 11, rule: k8s.probe.startup_for_slow_start, severity: high, mc_ref: m03, note: "startupProbe 없이 시작 직후부터 liveness가 5초마다 돌아, 90초 시작 중에 컨테이너가 재시작된다." }
      df_deps: { from: 13, to: 13, rule: k8s.probe.liveness_no_dependency, severity: high, mc_ref: m02, note: "liveness가 DB·캐시까지 확인해 의존성 장애 하나에 모든 Pod가 재시작된다. 프로세스 자신만 보는 경로로 바꾼다." }
      df_threshold: { from: 16, to: 16, rule: k8s.probe.failure_threshold_margin, severity: mid, note: "failureThreshold 1이라 응답이 한 번만 늦어도 재시작된다. 기본값 3 이상으로 여유를 둔다." }
    explanation_md: "세 결함은 각각 느린 시작 보호 누락(k04), 의존성을 확인하는 liveness(k08), 지나치게 민감한 재시작 임계값(k02)이다. readiness 프로브 설정은 결함이 아니다."
  i11:
    format: error_find
    facet: code
    response_mode: recognition
    level: 2
    bloom: analyze
    ku_refs: [k05, k04]
    mc_refs: [m03]
    stem_family: sf_probe_manifest
    gate_status: authored
    stem: "이 워커는 준비에 약 60초가 걸리고, 준비가 끝나면 `/tmp/started` 파일을 만든다. 배포하면 준비를 마치기 전에 컨테이너가 계속 재시작된다. 원인이 된 줄을 고르세요."
    code:
      lang: yaml
      src: |
        containers:
          - name: worker
            image: registry.example.com/report-worker:2.0.0
            startupProbe:
              exec:
                command: ["cat", "/tmp/started"]
              periodSeconds: 5
              failureThreshold: 3
            livenessProbe:
              exec:
                command: ["cat", "/tmp/alive"]
              periodSeconds: 10
    answer: { from: 7, to: 8 }
    bug_mc: m03
    hints:
      h1: "startupProbe가 시작을 기다려 주는 최대 시간을 계산해 보세요."
      h2: "그 시간은 두 필드의 곱으로 정해집니다."
      h3: "5초 × 3회가 60초 준비 시간보다 짧습니다."
      h4: "7~8번째 줄의 startupProbe 예산이 5 × 3 = 15초뿐이라 60초 준비를 기다리지 못하고 컨테이너가 종료된다. failureThreshold를 15 이상(예: 18)으로 늘린다."
    explanation_md: "startupProbe의 허용 시간은 periodSeconds × failureThreshold다(k05). 15초 안에 /tmp/started가 생기지 않으니 startupProbe가 실패해 컨테이너가 종료된다. liveness는 startup이 성공하기 전에는 돌지 않으므로 원인이 아니다(k04)."
  i12:
    format: blank_note
    facet: mechanism
    response_mode: production
    level: 2
    bloom: understand
    ku_refs: [k01, k02, k03, k04, k05, k06, k07, k08, k09, k10, k11]
    stem_family: sf_recall_free
    gate_status: authored
    prompt: "쿠버네티스 프로브를 처음 설정하는 동료에게 설명한다고 생각하고 기억나는 대로 적어 보세요. 세 프로브의 역할과 실패 결과, 실행 순서, 설정 값, 설계할 때 피할 점을 다루면 좋습니다."
    idea_units:
      iu_kubelet: { text: "kubelet이 컨테이너에 주기적으로 실행하는 진단이다", ku_ref: k01, weight: 0.5, keywords: ["kubelet", "진단", "주기"] }
      iu_liveness: { text: "liveness 실패는 컨테이너 종료·재시작으로 이어진다", ku_ref: k02, weight: 2, keywords: ["liveness", "재시작", "restart"] }
      iu_readiness: { text: "readiness 실패는 재시작 없이 엔드포인트에서 뺀다", ku_ref: k03, weight: 2, keywords: ["readiness", "엔드포인트", "트래픽"] }
      iu_startup_gate: { text: "startupProbe가 성공할 때까지 다른 프로브가 멈춘다", ku_ref: k04, weight: 1.5, keywords: ["startup", "startupProbe", "느린 시작"] }
      iu_budget: { text: "시작 허용 시간은 failureThreshold × periodSeconds다", ku_ref: k05, weight: 1, keywords: ["failureThreshold", "periodSeconds", "곱"] }
      iu_methods: { text: "exec·httpGet·tcpSocket·grpc 방식이 있고 HTTP는 200~399가 성공이다", ku_ref: k06, weight: 0.5, keywords: ["httpGet", "exec", "tcpSocket", "grpc"] }
      iu_defaults: { text: "기본값은 주기 10초·타임아웃 1초·실패 3회다", ku_ref: k07, weight: 0.5, keywords: ["기본값", "10초", "3회"] }
      iu_no_deps: { text: "liveness에 외부 의존성 확인을 넣지 않는다", ku_ref: k08, weight: 2, keywords: ["의존성", "DB", "연쇄"] }
      iu_no_readiness: { text: "readiness가 없으면 바로 준비된 것으로 본다", ku_ref: k09, weight: 1, keywords: ["readiness 없음", "바로", "Ready"] }
      iu_success_one: { text: "liveness·startup의 successThreshold는 1이다", ku_ref: k10, weight: 0.5, keywords: ["successThreshold", "1"] }
      iu_continuous: { text: "readiness는 실행 내내 계속 돈다", ku_ref: k11, weight: 1, keywords: ["계속", "주기적", "실행 중"] }
    solo_rubric: rb.solo-5
    model_note_md: |
      프로브는 각 노드의 kubelet이 컨테이너에 주기적으로 실행하는 진단이다. 방식은 exec·httpGet·tcpSocket·grpc가 있고
      HTTP는 200 이상 400 미만이면 성공이다. liveness가 연속 실패하면 컨테이너를 종료하고 restartPolicy대로 다시 띄운다.
      readiness가 실패하면 재시작 없이 Ready를 잃고 Service 엔드포인트에서 빠지며, 실행 내내 주기적으로 돈다.
      readiness가 없으면 바로 준비된 것으로 본다. startupProbe가 있으면 성공할 때까지 나머지 프로브가 멈추고,
