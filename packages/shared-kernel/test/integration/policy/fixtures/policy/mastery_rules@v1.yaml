# 테스트용 fixture — contracts MasteryRulesV1과 같은 모양
version: mastery_rules@v1
epsilon: 1.0e-9
elo:
  alpha: 0.2
  b: 400
  guess_correction: true
  unqualified_ceiling: 0.7
  theta_q:
    w_format_min: 0.3
    w_grader_min: 0.5
theta_shrink:
  theta_prior: 0
  theta_shrink_n0: 5
  theta_display_min_events: 3
mastery:
  p_min: 0.8
  formats_min: 2
  distinct_days_min: 3
  format_counts:
    w_format_min: 0.3
    w_grader_min: 0.5
w_grader:
  D: 1
  J_calibrated: 0.9
  J_uncalibrated: 0.6
  J_low_confidence: 0.4
  LJ: 0.7
  H: 0.8
  S: 0.3
  PENDING: 0
promotion:
  empty_level: skip
  required_mastered:
    all_if_n_le: 3
    ratio: 0.8
    allow_misses: 1
sparse:
  depth_scope: track
d4:
  floor_mode: min_with_possible
  possible_scope: level_le_k
assessment:
  items: 12
  formats_min: 3
  selection: round_robin_by_format
  engines:
    - deterministic
    - calibrated_jev_if_sp1_pass
  accuracy_min_correct:
    "1": 8
    "2": 9
    "3": 10
    "4": 10
  cbm_denominator: chosen_confidence_max
  cbm_min:
    "1": 0.5
    "2": 0.55
    "3": 0.6
    "4": 0.65
  retry_days: 3
ai_profiles:
  FULL:
    rubric_engine: { sp1_pass: J, sp1_fail: LJ }
    provisional_if_self_only: false
  JUDGE_ONLY:
    rubric_engine: { sp1_pass: J, sp1_fail: S_provisional }
    provisional_if_self_only: false
  LLM_ONLY:
    rubric_engine: { sp1_pass: LJ, sp1_fail: LJ }
    provisional_if_self_only: true
  OFFLINE:
    rubric_engine: { sp1_pass: S_provisional, sp1_fail: S_provisional }
    provisional_if_self_only: true
