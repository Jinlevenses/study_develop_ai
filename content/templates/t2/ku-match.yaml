# content/templates/t2/ku-match.yaml
# yaml-language-server: $schema=../../.schemas/templates-t2.schema.json
schema_v: 1
id: ku-match
kind: t2
format: matching
facet: contrast
response_mode: recognition
stem_family: sf_t2_match
source: { from: ku_set, ku_types: [definition, comparison] }
template:
  stem: "{{concept.title_ko}}의 용어와 설명을 알맞게 짝지으시오."
  answer: "{{ku_set.pairs}}"
constraints: { dedupe_jaccard: 0.85, max_instances: 6 }
metamorphic: { preserve: [option_order], flip: [] }
stakes_max: S1
applies_to: { tiers: [A, B] }
