# content/templates/rubrics/artifact-generic.yaml
# yaml-language-server: $schema=../../.schemas/rubrics.schema.json
schema_v: 1
id: rb.artifact-generic
title_ko: "산출물 일반"
applies_to: [artifact]
dims:
  d_problem:
    name_ko: "문제 정의"
    weight: 1
    levels:
      l1: "해결할 문제가 드러나지 않거나 모호하다."
      l2: "문제를 말하지만 범위와 제약이 빠져 있다."
      l3: "문제와 범위를 밝히고 주요 제약 하나를 근거와 함께 적는다."
      l4: "문제와 범위, 제약과 성공 기준을 근거와 함께 분명히 적는다."
  d_alternatives:
    name_ko: "대안"
    weight: 1
    levels:
      l1: "대안을 검토한 흔적이 없다."
      l2: "대안을 나열하지만 서로 비교하지 않는다."
      l3: "대안을 둘 이상 비교하고 차이 하나를 근거와 함께 짚는다."
      l4: "대안을 기준에 따라 비교하고 각각의 득실을 근거로 뒷받침한다."
  d_rationale:
    name_ko: "결정 근거"
    weight: 1.5
    levels:
      l1: "결정만 있고 이유가 없거나 이유가 결정과 맞지 않는다."
      l2: "이유를 들지만 앞의 제약이나 대안과 연결하지 못한다."
      l3: "결정의 이유를 제약과 연결해 대체로 타당하게 설명한다."
      l4: "결정의 이유를 제약과 대안 비교에 연결하고 근거와 예시로 뒷받침한다."
  d_consequences:
    name_ko: "결과"
    weight: 1
    levels:
      l1: "결정이 가져올 결과를 다루지 않는다."
      l2: "좋은 결과만 말하고 감수할 비용은 쓰지 않는다."
      l3: "이득과 비용을 모두 쓰고 영향받는 부분 하나를 짚는다."
      l4: "이득과 비용, 후속 영향과 되돌릴 방법까지 근거와 함께 쓴다."
  d_verification:
    name_ko: "검증"
    weight: 1
    levels:
      l1: "결정이 맞는지 확인할 방법이 없다."
      l2: "확인하겠다고만 쓰고 구체적인 방법은 없다."
      l3: "확인할 방법 하나를 기준과 함께 구체적으로 제시한다."
      l4: "확인 방법과 합격 기준, 틀렸을 때의 대응을 구체적으로 제시한다."
pass_mean: 2.5
