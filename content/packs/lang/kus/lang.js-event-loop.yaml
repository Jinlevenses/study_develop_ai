    cloze_keys: ["작은 조각"]
    accept: { "작은 조각": ["조각", "청크", "chunk", "작은 단위"] }
    source_refs:
      - { source_id: src.mdn, locator: "/en-US/docs/Web/JavaScript/Reference/Execution_model#never_blocking", section: "Never blocking", usage: paraphrase, retrieved_at: "2026-10-02" }
