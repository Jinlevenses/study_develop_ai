schema_v: 1
id: rb.feynman-teach
title_ko: "파인만 가르치기 루브릭"
applies_to: [feynman]
dims:
  d_correctness:
    name_ko: "정확성"
    weight: 1
    levels:
      l1: "학생의 오개념을 바로잡지 못하고 오히려 강화한다."
      l2: "오개념을 짚지만 설명이 일부 틀린다."
      l3: "오개념을 정확한 설명으로 바로잡는다."
      l4: "오개념이 왜 생기는지까지 짚어 준다."
  d_simplicity:
    name_ko: "단순화"
    weight: 1
    levels:
      l1: "전문 용어를 그대로 쓰며 풀어 설명하지 않는다."
      l2: "용어를 풀지만 설명이 길고 복잡하다."
      l3: "쉬운 말로 핵심만 간결하게 설명한다."
      l4: "비유를 써서 학생 수준에 맞게 단순화한다."
  d_example:
    name_ko: "예시"
    weight: 1
    levels:
      l1: "예시를 하나도 들지 않고 설명한다."
      l2: "예시가 있지만 설명과 무관하다."
      l3: "설명에 맞는 구체적 예시를 든다."
      l4: "반례나 경계 사례까지 예시로 보여 준다."
  d_gaps:
    name_ko: "빈틈 점검"
    weight: 1
    levels:
      l1: "학생의 이해 여부를 확인하지 않는다."
      l2: "이해했는지 한 번 묻고 넘어간다."
      l3: "학생의 답을 보고 빈틈을 찾아 보충한다."
      l4: "스스로 설명하게 해서 남은 빈틈까지 드러낸다."
pass_mean: 2.5
