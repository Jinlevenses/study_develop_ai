      l2: "일부는 맞지만 틀린 부분이 섞여 있고 근거가 제시되지 않는다."
      l3: "대체로 정확하며 핵심 주장 하나를 근거와 함께 뒷받침한다."
      l4: "내용이 정확하고 근거와 구체적 예시로 모든 핵심 주장을 뒷받침한다."
