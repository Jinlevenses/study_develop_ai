# content/packs/lang/items/lang.js-event-loop.yaml
# yaml-language-server: $schema=../../../.schemas/items.schema.json
schema_v: 1
concept_id: lang.js-event-loop
items:
  # ── 핵심 12 ──────────────────────────────────────────────
  i01:
    format: ox
    facet: contrast
    response_mode: recognition
    level: 2
    bloom: remember
    ku_refs: [k04]
    stem_family: sf_queue_kind
    roles: [pretest]
    gate_status: authored
    stem: "`Promise.then`에 등록한 콜백은 마이크로태스크로, `setTimeout`에 넘긴 콜백은 태스크로 예약된다."
    answer: true
    correction_md: "맞다. then·catch·finally·queueMicrotask 콜백은 마이크로태스크, setTimeout 콜백은 태스크다."
    explanation_md: "어느 큐에 들어가는지가 실행 순서를 정한다(k04). 둘 다 '비동기'라고 같은 큐에 넣으면 then이 타이머보다 먼저 실행되는 이유를 설명할 수 없다."
  i02:
    format: ox
    facet: mechanism
    response_mode: recognition
    level: 2
    bloom: understand
    ku_refs: [k03, k05]
    mc_refs: [m01]
    stem_family: sf_queue_kind
    gate_status: authored
    stem: "한 스크립트에서 `setTimeout(a, 0)`을 먼저 호출하고 `Promise.resolve().then(b)`를 나중에 호출하면, 지연이 0이므로 a가 b보다 먼저 실행된다."
    answer: false
    false_mc: m01
    correction_md: "틀렸다. b는 마이크로태스크라 스크립트가 끝나자마자 실행되고, a는 태스크라 그 뒤 다음 차례에 실행된다."
    explanation_md: "등록 순서보다 큐의 종류가 우선한다. 태스크가 끝나면 마이크로태스크를 모두 비운 뒤 다음 태스크로 가고(k03), 0은 최소 지연일 뿐이다(k05). '0초니까 먼저'라는 생각이 m01이다."
  i03:
    format: ox
    facet: code
    response_mode: recognition
    level: 2
    bloom: understand
    ku_refs: [k06]
    mc_refs: [m03]
    stem_family: sf_sync_part
    gate_status: authored
    stem: "`new Promise((resolve) => { console.log('x'); resolve(); })`에서 'x'는 then 콜백처럼 현재 스크립트가 끝난 뒤에 출력된다."
    answer: false
    false_mc: m03
    correction_md: "틀렸다. executor는 Promise를 만드는 그 자리에서 동기로 실행되므로 'x'는 곧바로 출력된다."
    explanation_md: "Promise 생성자는 넘겨받은 함수를 즉시 호출한다(k06). 비동기로 미뤄지는 것은 then에 등록한 콜백뿐이며, executor까지 미뤄진다고 보는 것이 m03이다."
  i04:
    format: ox
    facet: code
    response_mode: recognition
    level: 2
    bloom: understand
    ku_refs: [k07]
    stem_family: sf_sync_part
    gate_status: authored
    stem: "async 함수 본문에서 첫 `await`보다 앞에 있는 코드는 그 함수를 호출한 시점에 호출한 쪽에서 곧바로 실행된다."
    answer: true
    correction_md: "맞다. async 함수는 첫 await를 만날 때까지 동기로 실행되고, 그 뒤의 나머지만 마이크로태스크로 이어진다."
    explanation_md: "async 함수는 다른 스레드에서 도는 것이 아니라 같은 스레드에서 await까지 진행한 뒤 Promise를 돌려준다(k07). 그래서 호출 직후의 동기 코드보다 첫 await 앞부분이 먼저 실행된다."
  i05:
    format: mcq
    facet: contrast
    response_mode: recognition
    level: 2
    bloom: understand
    ku_refs: [k04, k03]
    mc_refs: [m01, m04, m03]
    stem_family: sf_queue_kind
    roles: [pretest]
    gate_status: authored
    stem: "다음 중 현재 실행 중인 스크립트가 끝난 직후, 대기 중인 `setTimeout(fn, 0)` 콜백보다 **먼저** 실행되는 것은?"
    options:
      opt_a: "`queueMicrotask`에 넘긴 콜백"
      opt_b: "`setTimeout`에 두 번째로 넘긴 콜백"
      opt_c: "`setInterval`의 첫 번째 콜백"
      opt_d: "다음 사용자 클릭 이벤트의 처리기"
    answer: opt_a
    distractor_mc: { opt_b: m01, opt_c: m04, opt_d: m04 }
    option_rationale:
      opt_a: "queueMicrotask 콜백은 마이크로태스크라 스크립트가 끝나자마자 실행된다."
      opt_b: "두 번째 setTimeout도 태스크라 먼저 등록된 타이머 뒤에 실행된다."
      opt_c: "setInterval 콜백도 타이머 태스크라 마이크로태스크보다 늦다."
      opt_d: "이벤트 처리기도 태스크라 마이크로태스크를 모두 비운 뒤에야 차례가 온다."
    explanation_md: "정답은 opt_a다. 마이크로태스크는 태스크가 끝날 때마다 다음 태스크보다 먼저 모두 실행된다(k03, k04). 나머지 셋은 모두 태스크라 큐 순서를 기다린다. 타이머가 먼저라고 보는 것은 m01, 태스크와 마이크로태스크가 번갈아 돈다고 보는 것은 m04다."
  i06:
    format: mcq
    facet: mechanism
    response_mode: recognition
    level: 2
    bloom: apply
    ku_refs: [k07, k01]
    mc_refs: [m02, m03]
    stem_family: sf_sync_part
    gate_status: authored
    stem: "`async function f() { heavy(); await g(); }`에서 `heavy()`는 1초 걸리는 동기 계산이다. 메인 코드가 `f(); console.log('done');`를 실행할 때 일어나는 일로 가장 알맞은 것은?"
    options:
      opt_a: "heavy()가 1초 동안 같은 스레드를 붙잡은 뒤에야 'done'이 출력된다"
      opt_b: "f가 별도 스레드에서 돌기 때문에 'done'은 기다림 없이 곧바로 출력된다"
      opt_c: "async 함수 본문 전체가 나중에 실행되므로 'done'이 heavy()보다 먼저 출력된다"
      opt_d: "await가 있는 함수는 호출 즉시 일시 정지되어 heavy()는 g()가 끝난 뒤 실행된다"
    answer: opt_a
    distractor_mc: { opt_b: m02, opt_c: m03, opt_d: m02 }
    option_rationale:
      opt_a: "첫 await 앞의 heavy()는 호출 시점에 동기로 실행된다."
      opt_b: "async 함수도 같은 스레드에서 돈다."
      opt_c: "본문은 첫 await까지 즉시 실행된다. executor·본문을 미뤄진다고 보는 착각과 같다."
      opt_d: "멈추는 지점은 await를 만나는 순간이지 함수 시작이 아니다."
    explanation_md: "정답은 opt_a다. async 함수는 첫 await까지 호출한 쪽에서 동기로 실행되고(k07), JS는 호출 스택 하나에서 돈다(k01). opt_b·opt_d는 async를 별도 실행 흐름으로 보는 m02, opt_c는 동기 부분까지 미뤄진다고 보는 m03에서 나온다."
  i07:
    format: mcq
    facet: operation
    response_mode: recognition
    level: 2
    bloom: analyze
    ku_refs: [k09, k05]
    mc_refs: [m05, m02, m04]
    stem_family: sf_blocking
    gate_status: authored
    stem: "브라우저 페이지에서 버튼을 누르면 300ms 걸리는 동기 계산이 돈다. 그동안 예약해 둔 `setTimeout(tick, 50)`과 화면 갱신은 어떻게 되는가?"
    options:
      opt_a: "계산이 끝날 때까지 tick도 화면 갱신도 실행되지 못하고 그 뒤로 밀린다"
      opt_b: "tick은 정확히 50ms 뒤에 실행이 보장되므로 계산 도중에 끼어들어 실행된다"
      opt_c: "타이머 콜백은 별도 스레드에서 돌기 때문에 계산과 동시에 실행된다"
      opt_d: "계산 도중에 tick과 계산이 한 줄씩 번갈아 실행되어 둘 다 조금씩 늦어진다"
    answer: opt_a
    distractor_mc: { opt_b: m05, opt_c: m02, opt_d: m04 }
    option_rationale:
      opt_a: "실행 중인 콜백은 끝날 때까지 끼어들기를 당하지 않으므로 다른 콜백과 렌더링이 모두 기다린다."
      opt_b: "지연값은 최소 대기 시간이며 정확한 실행 시각을 보장하지 않는다."
      opt_c: "타이머 콜백도 같은 스레드의 이벤트 루프에서 실행된다."
      opt_d: "콜백 단위로 끝까지 실행되며 줄 단위로 섞이지 않는다."
    explanation_md: "정답은 opt_a다. 긴 동기 계산은 호출 스택을 붙잡아 타이머와 화면 갱신을 모두 미룬다(k09). 50은 최소 지연일 뿐이다(k05). opt_b는 m05, opt_c는 m02, opt_d는 실행이 섞인다고 보는 m04에서 나온다."
  i08:
    format: cloze
    facet: mechanism
    response_mode: production
    level: 2
    bloom: remember
    ku_refs: [k03, k04]
    stem_family: sf_cloze_loop
    gate_status: authored
    stem: "이벤트 루프는 태스크 하나를 실행한 뒤 다음 태스크로 가기 전에 {{b1}} 큐를 빌 때까지 모두 실행한다. Promise의 then 콜백은 이 큐에, setTimeout 콜백은 {{b2}} 큐에 들어간다."
    blanks:
      b1: { accept: ["마이크로태스크", "microtask", "마이크로 태스크"] }
      b2: { accept: ["태스크", "task", "매크로태스크", "macrotask", "타이머"] }
    explanation_md: "태스크가 끝날 때마다 마이크로태스크 큐를 비운다(k03). then 콜백은 마이크로태스크, setTimeout 콜백은 태스크다(k04). 두 큐를 바꿔 쓰면 실행 순서 예측이 거꾸로 된다."
  i09:
    format: short
    facet: mechanism
    response_mode: production
    level: 2
    bloom: apply
    ku_refs: [k03, k04]
    stem_family: sf_order_short
    gate_status: authored
    stem: "`setTimeout(c, 0); Promise.resolve().then(a).then(b);`를 실행했다. 콜백 a·b·c가 실행되는 순서를 쉼표로 이어 쓰세요(예: x,y,z)."
    accept: ["a,b,c", "abc", "a→b→c"]
    normalize: { case: insensitive, space: remove }
    explanation_md: "a는 마이크로태스크, b는 a가 끝난 뒤 예약되는 마이크로태스크이고, 같은 체크포인트 안에서 연달아 실행된다(k03). c는 태스크라 마이크로태스크가 모두 끝난 뒤에 온다(k04). c,a,b라고 답했다면 등록 순서를 따른 것이다."
  i10:
    format: code_predict
    facet: mechanism
    response_mode: production
    level: 2
    bloom: apply
    ku_refs: [k03, k04]
    mc_refs: [m01, m04]
    stem_family: sf_predict_output
    gate_status: authored
    stem: "다음 코드를 Node.js 22로 실행하면 표준 출력에 무엇이 찍히는가? 한 줄에 하나씩 순서대로 쓰세요."
    code:
      lang: js
      src: |
        setTimeout(() => {
          console.log('timer 1');
          Promise.resolve().then(() => console.log('then in timer 1'));
        }, 0);
        setTimeout(() => console.log('timer 2'), 0);
        Promise.resolve().then(() => console.log('then'));
        console.log('sync');
    answer:
      stdout: |-
        sync
        then
        timer 1
        then in timer 1
        timer 2
    explanation_md: "동기 코드 'sync'가 먼저고, 스크립트(첫 태스크)가 끝나면 마이크로태스크 'then'이 실행된다(k03). 이어서 태스크 'timer 1'이 돌고, 그 안에서 예약한 마이크로태스크가 다음 태스크 'timer 2'보다 먼저 실행된다(k04). 'timer 2'를 'then in timer 1'보다 앞에 두었다면 m04, 'timer 1'을 'then'보다 앞에 두었다면 m01이다."
  i11:
    format: code_predict
    facet: code
    response_mode: production
    level: 2
    bloom: apply
    ku_refs: [k07, k04, k05]
    mc_refs: [m02, m01]
    stem_family: sf_predict_output
    gate_status: authored
    stem: "다음 코드를 Node.js 22로 실행하면 표준 출력에 무엇이 찍히는가? 한 줄에 하나씩 순서대로 쓰세요."
    code:
      lang: js
      src: |
        async function load() {
          console.log('load start');
          await null;
          console.log('after await');
        }
        console.log('begin');
        setTimeout(() => console.log('timeout'), 0);
        load();
        queueMicrotask(() => console.log('microtask'));
        console.log('end');
    answer:
      stdout: |-
        begin
        load start
        end
        after await
        microtask
        timeout
    explanation_md: "load()는 첫 await까지 동기로 돌아 'load start'를 찍고, 나머지는 마이크로태스크로 예약된다(k07). 그 예약이 queueMicrotask보다 먼저라 'after await'가 'microtask'보다 앞선다. 'timeout'은 태스크라 맨 끝이다(k04, k05). 'load start'를 'end' 뒤에 두었다면 m02다."
  i12:
    format: blank_note
    facet: mechanism
    response_mode: production
    level: 2
    bloom: understand
    ku_refs: [k01, k02, k03, k04, k05, k06, k07, k08, k09, k10]
    stem_family: sf_recall_free
    gate_status: authored
    prompt: "JavaScript 비동기 코드의 실행 순서를 처음 배우는 동료에게 설명한다고 생각하고 기억나는 대로 적어 보세요. 호출 스택, 태스크와 마이크로태스크, Promise와 async 함수의 동기 부분, 루프를 막는 코드를 다루면 좋습니다."
    idea_units:
      iu_stack: { text: "호출 스택 하나에서 실행하고 루프가 태스크를 하나씩 꺼낸다", ku_ref: k01, weight: 1, keywords: ["호출 스택", "이벤트 루프", "단일 스레드"] }
      iu_rtc: { text: "실행 중인 콜백은 끝날 때까지 끼어들기를 당하지 않는다", ku_ref: k02, weight: 0.5, keywords: ["실행 완료", "run-to-completion"] }
      iu_drain: { text: "태스크가 끝나면 마이크로태스크를 큐가 빌 때까지 모두 실행한다", ku_ref: k03, weight: 2, keywords: ["마이크로태스크", "모두", "비운다"] }
      iu_which_queue: { text: "then·queueMicrotask는 마이크로태스크, setTimeout은 태스크다", ku_ref: k04, weight: 1.5, keywords: ["then", "setTimeout", "queueMicrotask"] }
      iu_zero: { text: "setTimeout 0은 최소 지연이라 마이크로태스크 뒤에 실행된다", ku_ref: k05, weight: 1, keywords: ["0", "최소", "지연"] }
      iu_executor: { text: "Promise executor는 동기로 즉시 실행된다", ku_ref: k06, weight: 1, keywords: ["executor", "동기", "생성자"] }
      iu_await: { text: "async 함수는 첫 await까지 동기, 나머지는 마이크로태스크다", ku_ref: k07, weight: 1.5, keywords: ["async", "await", "동기"] }
      iu_starve: { text: "마이크로태스크를 계속 예약하면 태스크와 렌더링이 굶는다", ku_ref: k08, weight: 1, keywords: ["굶", "무한", "렌더링"] }
      iu_block: { text: "긴 동기 계산은 타이머와 화면 갱신을 모두 미룬다", ku_ref: k09, weight: 1, keywords: ["블로킹", "막는다", "지연"] }
      iu_chunk: { text: "무거운 일은 조각내거나 워커로 옮긴다", ku_ref: k10, weight: 0.5, keywords: ["조각", "워커", "worker"] }
    solo_rubric: rb.solo-5
    model_note_md: |
      JavaScript는 호출 스택 하나에서 실행되고, 이벤트 루프는 스택이 비면 태스크를 하나 꺼내 끝까지 실행한다. 실행 중인
      콜백은 다른 콜백에게 끼어들기를 당하지 않는다. 태스크가 끝나면 다음 태스크 전에 마이크로태스크 큐를 빌 때까지 모두
      실행하며, 그 사이 새로 예약된 것도 같은 차례에 처리한다. then·catch·finally·queueMicrotask와 await 뒤 코드는
      마이크로태스크, setTimeout·I/O 콜백은 태스크다. 그래서 setTimeout 0은 최소 지연일 뿐 then보다 늦다. Promise
